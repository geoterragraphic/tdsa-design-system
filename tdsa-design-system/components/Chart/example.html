<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart — TDSA design system</title>
<link rel="icon" href="../../assets/logos/tdsa-icon-positive.png">
<link rel="stylesheet" href="../../tdsa.css">
</head>
<body>
<div class="td-chart">
<svg viewBox="0 0 520 200" role="img" aria-label="Example bar chart in the five series colours">
  <line class="grid" x1="40" y1="20" x2="510" y2="20"/><line class="grid" x1="40" y1="70" x2="510" y2="70"/><line class="grid" x1="40" y1="120" x2="510" y2="120"/><line class="grid" x1="40" y1="170" x2="510" y2="170"/>
  <text class="lbl" x="32" y="174" text-anchor="end">0</text><text class="lbl" x="32" y="124" text-anchor="end">50</text><text class="lbl" x="32" y="74" text-anchor="end">100</text><text class="lbl" x="32" y="24" text-anchor="end">150</text>
  <rect class="s1" x="60" y="40" width="56" height="130"/><rect class="s2" x="156" y="70" width="56" height="100"/><rect class="s3" x="252" y="95" width="56" height="75"/><rect class="s4" x="348" y="115" width="56" height="55"/><rect class="s5" x="444" y="135" width="56" height="35"/>
  <text class="lbl" x="88" y="190" text-anchor="middle">FineDay</text><text class="lbl" x="184" y="190" text-anchor="middle">Dusk</text><text class="lbl" x="280" y="190" text-anchor="middle">Twilight</text><text class="lbl" x="376" y="190" text-anchor="middle">Dawn</text><text class="lbl" x="472" y="190" text-anchor="middle">Night</text>
</svg>
</div>
</body>
</html>
